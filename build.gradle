plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.0.1'
}

group 'org.example'
version '1.0'

repositories {
    mavenCentral()
}

javafx {
    version = "22.0.1"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

jlink {
    launcher {
        name = 'weatherApp'
    }
}

application {
    mainModule = 'src'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src/resources']
        }
    }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'com.jcraft:jzlib:1.1.3'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    implementation 'com.pi4j:pi4j-core:2.5.1'
    implementation 'com.pi4j:pi4j-plugin-raspberrypi:2.5.1'
    implementation 'com.pi4j:pi4j-plugin-gpiod:2.5.1'
    implementation 'com.pi4j:pi4j-plugin-linuxfs:2.5.1'
    implementation 'com.pi4j:pi4j-library-linuxfs:2.5.1'
    implementation 'com.fazecast:jSerialComm:2.11.0'
}

mainClassName = 'gui.Entry'
